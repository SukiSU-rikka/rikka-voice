org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# ── 引擎开关：缺哪个依赖就先关哪个，其余照常编译 ──
# VOICEVOX CORE（需要 third_party/maven 里的 voicevoxcore-android 和 jniLibs 里的 libvoicevox_onnxruntime.so）
rikka.engine.voicevox=true
rikka.voicevox.version=0.16.4
# sherpa-onnx（Supertonic 3 日语）（需要 app/libs/sherpa-onnx.aar）
rikka.engine.sherpa=true
# piper-plus（实验，需要先按 构建说明.md 第 4 步对齐 C API 再打开）
rikka.engine.piperplus=false
