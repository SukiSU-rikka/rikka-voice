org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# ── 引擎开关：缺哪个依赖就先关哪个，其余照常编译 ──
# VOICEVOX CORE（C API 版：jniLibs 里放 libvoicevox_core.so + libvoicevox_onnxruntime.so，需要 NDK）
rikka.engine.voicevox=true
# sherpa-onnx（Supertonic 3 日语）（需要 app/libs/sherpa-onnx.aar）
rikka.engine.sherpa=true
# piper-plus（实验，需要先按 构建说明.md 第 4 步对齐 C API 再打开）
rikka.engine.piperplus=false
