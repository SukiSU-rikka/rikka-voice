name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.11.1' }
      - name: Install NDK and CMake
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "cmake;3.22.1" "ndk;27.2.12479018" || true
          ls $ANDROID_HOME/ndk || true
      - name: Fetch engine deps
        run: |
          set -e
          mkdir -p app/src/main/jniLibs/arm64-v8a app/libs
          curl -sL -o /tmp/core.zip https://github.com/VOICEVOX/voicevox_core/releases/download/0.17.1/voicevox_core-android-arm64-0.17.1.zip
          unzip -qo /tmp/core.zip -d /tmp/core
          find /tmp/core -name "libvoicevox_core.so" -exec cp {} app/src/main/jniLibs/arm64-v8a/ \;
          curl -sL -o /tmp/ort.tgz https://github.com/VOICEVOX/onnxruntime-builder/releases/download/voicevox_onnxruntime-1.23.2/voicevox_onnxruntime-android-arm64-1.23.2.tgz
          mkdir -p /tmp/ort && tar -xzf /tmp/ort.tgz -C /tmp/ort
          find /tmp/ort -name "libvoicevox_onnxruntime.so*" -exec cp {} app/src/main/jniLibs/arm64-v8a/libvoicevox_onnxruntime.so \;
          test -f app/src/main/jniLibs/arm64-v8a/libvoicevox_core.so
          test -f app/src/main/jniLibs/arm64-v8a/libvoicevox_onnxruntime.so
          curl -sL -o /tmp/sherpa.aar https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-1.13.8.aar
          cp /tmp/sherpa.aar app/libs/sherpa-onnx.aar
          ls -la app/src/main/jniLibs/arm64-v8a app/libs
      - name: Build release APK
        run: gradle assembleRelease --no-daemon -q || gradle assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with: { name: rikka-voice-apk, path: app/build/outputs/apk/release/app-release.apk }
