name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.11.1' }
      - name: Install NDK and CMake
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "cmake;3.22.1" "ndk;27.2.12479018" || true
          ls $ANDROID_HOME/ndk || true
      - name: Fetch engine deps
        run: |
          set -e
          mkdir -p app/src/main/jniLibs/arm64-v8a app/libs
          curl -sL -o download https://github.com/VOICEVOX/voicevox_core/releases/download/0.16.4/download-linux-x64
          chmod +x download
          ./download --os android --cpu-arch arm64 --only c-api onnxruntime -o vv_android || (./download --help; exit 1)
          find vv_android -type f | head -30
          find vv_android -name "libvoicevox_core.so" -exec cp {} app/src/main/jniLibs/arm64-v8a/ \;
          find vv_android -name "libvoicevox_onnxruntime.so*" -exec cp {} app/src/main/jniLibs/arm64-v8a/libvoicevox_onnxruntime.so \;
          curl -sL -o /tmp/sherpa.aar https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-1.13.8.aar
          cp /tmp/sherpa.aar app/libs/sherpa-onnx.aar
          ls -la app/src/main/jniLibs/arm64-v8a app/libs
      - name: Build release APK
        run: gradle assembleRelease --no-daemon -q || gradle assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with: { name: rikka-voice-apk, path: app/build/outputs/apk/release/app-release.apk }
